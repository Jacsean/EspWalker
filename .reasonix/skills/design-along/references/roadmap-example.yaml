# knowledge/roadmap.yaml 示例
# 每个 - 开始一个节点。字段：
#   id        必填，唯一标识（parent 引用用）
#   label     显示名称
#   date      日期
#   status    active | superseded | abandoned | revisited
#   parent    父节点 id（形成树）
#   decision  关联的知识条目路径（可选）
#   reason    废弃/变更原因（可选）

- id: initial
  label: 初始方案：固定过期刷新
  date: 2026-10-01
  status: superseded

- id: queue-based
  label: 队列方案
  date: 2026-11-10
  status: abandoned
  parent: initial
  reason: 实现复杂度过高，收益不明显

- id: sliding-window
  label: 滑动窗口刷新
  date: 2026-11-23
  status: active
  parent: initial
  decision: decisions/token-refresh

- id: sliding-window-jitter
  label: 滑动窗口 + 抖动
  date: 2026-11-25
  status: active
  parent: sliding-window
  reason: 避免窗口边界同时刷新